name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync locked environment (core + notebooks + test extras)
        run: uv sync --extra notebooks --extra test --locked
      - name: ruff check
        run: uv run ruff check .
      - name: Test suite (unit, schema, notebook smoke, demo smoke -- all of tests/)
        # Runs generically over the whole tests/ directory rather than a
        # hand-maintained file list, so new test files are picked up
        # automatically. Notebook execution needs no TS-ICL checkpoint
        # download (notebook 06 degrades gracefully without it); the demo
        # smoke test falls back to cached predictions and does not require
        # live TS-ICL either -- both stay within CI's normal network/time
        # budget. Maintainer-only tests gated behind RUN_PRIVATE_SNAPSHOT_
        # COMPARISON / RUN_DEMO_SMOKE are skipped here by design (they need
        # private-repository files or a live TS-ICL checkpoint download not
        # available in CI).
        run: uv run pytest tests/ -q

  build-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
      - name: Compile report
        run: cd manuscript/report && tectonic main.tex
      - name: Compile English presentation
        run: cd manuscript/presentation && tectonic main.tex
      - name: Compile poster
        run: cd manuscript/poster && tectonic main.tex
      - name: Compile Spanish colleague presentation
        run: cd manuscript/presentation_colleagues_es && tectonic main.tex
