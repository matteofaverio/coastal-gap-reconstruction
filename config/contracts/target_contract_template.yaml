# Target contract TEMPLATE -- copy this file to config/contracts/<your_sensor>_target_contract.yaml
# and fill in every <FILL_IN> before running the pipeline against a new time series.
#
# This is the minimum set of decisions the pipeline in src/coastal_gap_reconstruction/ needs
# from you before it can run against a sensor/variable this repository has never seen. It does
# not replace judgment -- see docs/methodology/adapting_to_a_new_sensor.md for the questions
# you should answer *before* filling this in (what counts as "enough data for a trustworthy
# daily value", what gap lengths matter for your use case, whether your series has seasonality
# comparable to SEASON_MAP in artificial_gap_validation.py).
#
# Compare against target_contract.yaml (chlorophyll) and oxygen_target_contract.yaml for two
# worked examples from the same station.

canonical_target:
  name: <FILL_IN>                          # e.g. daily_mean_turbidity
  source_file: <FILL_IN>                   # path to your daily target CSV, must have a date
                                            # column plus the columns named below
  column: <FILL_IN>                        # the column to reconstruct, e.g. turbidity_mean
  observed_mask_column: <FILL_IN>          # boolean column: True if the day has enough valid
                                            # hourly (or sub-daily) observations to trust the
                                            # daily aggregate -- this is what data_loading.py's
                                            # ELIGIBLE_COL and every downstream function call
                                            # (via the eligible_col= parameter) needs
  eligibility_rule: <FILL_IN>              # human-readable statement of the rule that produced
                                            # observed_mask_column, e.g. "valid_hours >= 18"

  date_range:
    start: <FILL_IN>
    end: <FILL_IN>

  counts:
    total_rows: <FILL_IN>
    eligible_observed_days: <FILL_IN>
    missing_or_ineligible_days: <FILL_IN>

# How to run the pipeline once this contract is filled in (no code changes needed):
#
#   from coastal_gap_reconstruction.data_loading import load_daily_target
#   from coastal_gap_reconstruction.artificial_gap_validation import generate_gap_candidates, apply_artificial_gap
#   from coastal_gap_reconstruction.baseline_imputation import run_all_baselines
#   from coastal_gap_reconstruction.scoring_metrics import compute_gap_metrics
#
#   target_df = load_daily_target("<your source_file>")
#   gaps = generate_gap_candidates(target_df, target_col="<your column>", eligible_col="<your observed_mask_column>")
#   # then, per gap: apply_artificial_gap(..., target_col=...), run_all_baselines(..., target_col=..., eligible_col=...),
#   # compute_gap_metrics(..., target_col=...)
#
# See notebooks/09_adapting_the_workflow_to_a_new_sensor.ipynb for a runnable version of this
# against a real second dataset (oxygen).

canonical_gap_pool:
  allowed_gap_lengths: <FILL_IN>           # e.g. [1, 3, 7, 14, 30] -- pick lengths that matter
                                            # for how gaps actually occur in your sensor's record
  notes: >
    Optional: document any forbidden target substitutes (e.g. a satellite/model proxy for the
    same variable that must never be used as scoring ground truth), following the
    forbidden_target_substitutes pattern in target_contract.yaml, if one exists for your case.
