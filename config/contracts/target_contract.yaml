# Canonical chlorophyll target contract.
#
# Machine-checkable definition of "what is the reconstruction target" for this benchmark.
# Any script, model, or evaluation in this repository should be checkable against this file.

canonical_target:
  name: daily_in_situ_chlorophyll
  source_file: data_public/chlorophyll/chlorophyll_daily_target.csv
  column: chl_mean
  log_transform: log10(chl_mean)
  observed_mask_column: target_eligible_default
  eligibility_rule: "valid_hours >= 18"

  date_range:
    start: "2015-07-01"
    end: "2026-05-31"

  counts:
    total_rows: 3988
    eligible_observed_days: 3012
    missing_or_ineligible_days: 976

forbidden_target_substitutes:
  # Columns that must never be scored against as if they were the in-situ target. They are
  # satellite-derived proxies, legitimate as predictors (see feature_role_contract.yaml) but
  # not as ground truth for evaluating in-situ chlorophyll reconstruction.
  - column_pattern: "chl_cons_*"
    reason: "Satellite-derived chlorophyll proxy (consolidated product). Correlated with but
      distinct from the in-situ target; must not be used as scoring ground truth."
  - column_pattern: "chl_perm_*"
    reason: "Satellite-derived chlorophyll proxy (permissive/gap-free product). Same caveat as
      chl_cons_*."
  - column_pattern: "chl_anom_*"
    reason: "Satellite chlorophyll anomaly derivative; satellite-derived, not in-situ."
  - column_pattern: "*patchiness*"
    reason: "Satellite chlorophyll spatial-texture statistic, not the target."
  - column_pattern: "*patch_dist*"
    reason: "Satellite chlorophyll patch-distance statistic, not the target."

allowed_predictor_use_of_satellite_chl:
  allowed: true
  role: biological_proxy
  condition: "Satellite chlorophyll columns (chl_cons_*, chl_perm_*) may be used as predictors
    or as TS-ICL covariates. They must never be the column a model is scored against."

rule: >
  No model, benchmark, or report may score predictions against any column in
  forbidden_target_substitutes while presenting the result as evidence about in-situ
  chlorophyll reconstruction. The only valid scoring target is chl_mean (raw) or
  log10(chl_mean) (log), from canonical_target.source_file.
