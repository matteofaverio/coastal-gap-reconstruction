[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coastal-gap-reconstruction"
version = "0.1.0"
description = "Reusable utilities for retrospective reconstruction (imputation) of sparse coastal sensor time series, benchmarked on daily chlorophyll-a and dissolved oxygen at a Chilean coastal monitoring station."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Matteo Faverio" },
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.6"]
stats = ["scipy>=1.9"]

# NOTE: TS-ICL itself is intentionally NOT installed via this project's
# extras -- it lives only in the isolated demo environment created by
# demo/run_demo.sh (see demo/README.md). This extra installs just the
# torch dependency needed to *develop against* src/coastal_gap_reconstruction/tsicl_helpers.py
# (tensor-shape utilities) without pulling in tsicl or its checkpoint.
tsicl-dev = ["torch>=2.0"]
notebooks = ["jupyter", "matplotlib>=3.6", "scipy>=1.9", "scikit-learn>=1.1", "pillow"]
test = ["pytest>=7", "nbconvert>=7", "ipykernel", "jupyter", "matplotlib>=3.6", "scipy>=1.9", "scikit-learn>=1.1", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E712", "E714"]  # pandas boolean-Series comparisons read clearer this way
